name: Daily Manga Miner
on:
  schedule:
    - cron: '10 17 * * *'
  workflow_dispatch:

jobs:
  mine-manga:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 1. Cache node_modules for instant sub-3s bootstrap ──
      - name: Cache Node Modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # ── 2. Install dependencies only on cache miss ──
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci || npm install

      # ── 3. Run Smart Top 100 Manga Miner ──
      - name: Run Smart Top 100 Manga Miner
        run: npx ts-node manga_miner.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
