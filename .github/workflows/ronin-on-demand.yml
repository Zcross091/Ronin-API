name: Ronin On-Demand Mining
on:
  schedule:
    - cron: '30 4 * * *'  # Thrice-daily auto-crawl at 04:30 UTC (10:00 AM IST)
    - cron: '0 13 * * *'  # Thrice-daily auto-crawl at 13:00 UTC (6:30 PM IST)
    - cron: '10 17 * * *' # Thrice-daily auto-crawl at 17:10 UTC (10:40 PM IST)
  repository_dispatch:
    types: [search-or-mine]
  workflow_dispatch:
    inputs:
      query:
        description: 'Anime title to mine'
        required: false
      episode:
        description: 'Episode number'
        required: false
      source:
        description: 'Source override'
        required: false

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci || npm install

      - name: Install ts-node
        run: npm install -g ts-node typescript

      - name: Run miner
        run: |
          QUERY="${{ github.event.client_payload.query || github.event.inputs.query }}"
          EPISODE="${{ github.event.client_payload.episode || github.event.inputs.episode }}"
          SOURCE="${{ github.event.client_payload.source || github.event.inputs.source }}"
          
          if [ -z "$QUERY" ]; then
            echo "No query provided. Starting Scheduled Auto-Crawler Deep Miner (Top 50 AniList Pipeline)..."
            ts-node crawler.ts
          else
            echo "On-Demand User Mining for: $QUERY (Episode: $EPISODE, Source: $SOURCE)"
            ts-node runQuery.ts "$QUERY" "1" "$EPISODE" "$SOURCE"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOGO_DOMAINS: ${{ secrets.GOGO_DOMAINS || 'https://gogoanime.or.at,https://gogoanimes.cv,https://gogoanime.ist,https://gogoanime.cl' }}
          ANIWAVE_CLUSTER: ${{ secrets.ANIWAVE_CLUSTER || 'https://aniwave.to,https://aniwave.com.pl,https://aniwave.dk' }}
          HIANIME_CLUSTER: ${{ secrets.HIANIME_CLUSTER || 'https://hianimes.ru,https://hianime.to,https://hianime.sk' }}
          ANILIST_ACTIVE_DOMAIN: ${{ secrets.ANILIST_ACTIVE_DOMAIN || 'https://graphql.anilist.co' }}
          MYANIMELIST_ACTIVE_DOMAIN: ${{ secrets.MYANIMELIST_ACTIVE_DOMAIN }}
          NYAASI_ACTIVE_DOMAIN: ${{ secrets.NYAASI_ACTIVE_DOMAIN || 'https://nyaa.si' }}
