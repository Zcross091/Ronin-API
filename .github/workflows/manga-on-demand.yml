name: Manga On-Demand Mining
on:
  repository_dispatch:
    types: [search-or-mine-manga]
  workflow_dispatch:
    inputs:
      query:
        description: 'Manga title to mine'
        required: true
        default: 'Solo Leveling'
      chapter:
        description: 'Target chapter number'
        required: true
        default: '1'
jobs:
  mine-manga:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # ── 1. Cache node_modules for instant sub-3s bootstrap ──
      - name: Cache Node Modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # ── 2. Install dependencies only on cache miss ──
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci || npm install

      # ── 3. Run Priority Manga Miner ──
      - name: Run Priority Manga Miner
        run: |
          QUERY="${{ github.event.client_payload.query || github.event.inputs.query }}"
          CHAPTER="${{ github.event.client_payload.chapter || github.event.inputs.chapter }}"
          echo "Mining for Manga: $QUERY | Priority Chapter: $CHAPTER"
          
          npx ts-node on_demand_manga.ts "$QUERY" "$CHAPTER"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
